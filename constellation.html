  function seededRandom(seed) {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
  }

  const seed = 28;
  let s = seed;
  const yMax = document.body.scrollHeight;
  const yOffset = 200;


  for (let i = 0; i < messages.length; i++) {
  const x = seededRandom(s++) * window.innerWidth;
  const y = yOffset + seededRandom(s++) * (yMax - yOffset);
  const scale = seededRandom(s++) * 0.5 + 0.5;



      const star = document.createElement("img");
  star.src = "star.png";
  star.className = "star";
  star.style.left = `${x}px`;
  star.style.top = `${y}px`;
  star.style.width = `${20 * scale}px`;

  star.dataset.tooltip = messages[i];

    star.addEventListener("click", (e) => {
      tooltip.innerText = star.dataset.tooltip;
      tooltip.style.left = `${x + 25}px`;
      tooltip.style.top = `${y}px`;
      tooltip.style.display = "block";

      setTimeout(() => {
        tooltip.style.display = "none";
      }, 2000);
    });

    container.appendChild(star);
  }

  
addStarBtn.addEventListener("click", () => {
  const message = starMessageInput.value.trim();
  if (!message) {
    alert("Please enter a message for your star!");
    return;
  }

  const extraOffset = 80;
const x = Math.random() * (window.innerWidth - 30); // allow space for star size
const header = document.querySelector("h1");
const headerBottom = header ? header.getBoundingClientRect().bottom + window.scrollY : 200;
const y = headerBottom + extraOffset + Math.random() * (window.innerHeight - headerBottom - 100);

  const star = document.createElement("img");
  star.src = "star.png";  // Make sure this path is correct
  star.className = "star";
  star.style.left = `${x}px`;
  star.style.top = `${y}px`;
  star.style.width = "20px";
  star.style.height = "auto";
  star.dataset.tooltip = message;

  star.addEventListener("click", (e) => {
    tooltip.innerText = star.dataset.tooltip;
    tooltip.style.left = `${e.pageX + 10}px`;
    tooltip.style.top = `${e.pageY}px`;
    tooltip.style.display = "block";

    setTimeout(() => {
      tooltip.style.display = "none";
    }, 2000);
  });

  container.appendChild(star);

  starMessageInput.value = ""; // clear input
});
